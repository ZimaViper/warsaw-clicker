<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const DEFAULTS = {
  balance: 100,
  home: "Комната",
  car: "Нет машины",
  furniture: [],
  vip: false,
  taxiOrders: 0,
  taxiDate: new Date().toLocaleDateString("en-CA"),
  deliveryOrders: 0,
  deliveryCooldownUntil: 0
};

let data = {};

try {
  data = {
    ...DEFAULTS,
    ...JSON.parse(localStorage.getItem("warsawSave") || "{}")
  };
} catch (e) {
  data = { ...DEFAULTS };
}

if (!Array.isArray(data.furniture)) data.furniture = [];

const houses = [
  {name:"Комната",price:0,emoji:"🛏️",img:"https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=500"},
  {name:"Квартира",price:5000,emoji:"🏢",img:"https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=500"},
  {name:"Дом",price:50000,emoji:"🏡",img:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=500"},
  {name:"Особняк",price:500000,emoji:"🏰",img:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=500"}
];

const cars = [
  {name:"Fiat Panda",price:2000,emoji:"🚗",img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=700"},
  {name:"Opel Corsa",price:8000,emoji:"🚙",img:"https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=700"},
  {name:"Volkswagen Golf",price:20000,emoji:"🚘",img:"https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=700"},
  {name:"BMW 3",price:45000,emoji:"🚘",img:"https://images.unsplash.com/photo-1555215695-3004980ad54e?w=700"},
  {name:"Audi RS6",price:100000,emoji:"🏎️",img:"https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6?w=700"},
  {name:"Mercedes AMG",price:200000,emoji:"🏎️",img:"https://images.unsplash.com/photo-1563720223185-11003d516935?w=700"},
  {name:"BMW M5",price:400000,emoji:"🏎️",img:"https://images.unsplash.com/photo-1555215695-3004980ad54e?w=700"},
  {name:"Porsche 911",price:800000,emoji:"🏎️",img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=700"},
  {name:"Lamborghini",price:2000000,emoji:"🏎️",img:"https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=700"}
];

const furniture = [
  {name:"Диван",price:500,emoji:"🛋️",img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=700"},
  {name:"Телевизор",price:1000,emoji:"📺",img:"https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=700"},
  {name:"Кровать",price:1500,emoji:"🛏️",img:"https://images.unsplash.com/photo-1503602642458-232111445657?w=700"},
  {name:"Компьютер",price:3000,emoji:"💻",img:"https://images.unsplash.com/photo-1593640408182-31c70c8268f5?w=700"}
];

function el(id) {
  return document.getElementById(id);
}

function save() {
  localStorage.setItem("warsawSave", JSON.stringify(data));
  update();
}

function money(value) {
  return Math.floor(value).toLocaleString("ru-RU") + " zł";
}

function update() {
  if (el("balance")) el("balance").textContent = Number(data.balance).toFixed(2) + " zł";
  if (el("myhome")) el("myhome").textContent = data.home;
  if (el("insideHome")) el("insideHome").textContent = data.home;
  if (el("mycar")) el("mycar").textContent = data.car;
  if (el("topmoney")) el("topmoney").textContent = money(data.balance);
  if (el("myFurniture")) {
    el("myFurniture").textContent =
      data.furniture.length ? data.furniture.join(", ") : "Пока пусто";
  }

  const house = houses.find(h => h.name === data.home) || houses[0];
  if (el("outsideHouseImg")) el("outsideHouseImg").src = house.img;
  if (el("outsideHouseName")) el("outsideHouseName").textContent = house.name;

  const car = cars.find(c => c.name === data.car);
  if (el("outsideCar")) {
    el("outsideCar").innerHTML = car
      ? `<img src="${car.img}" alt="${car.name}">`
      : "🚗";
  }

  if (el("vipStatus")) {
    el("vipStatus").textContent = data.vip
      ? "👑 VIP активирован!"
      : "У тебя пока нет VIP.";
  }

  if (el("vipButton")) {
    el("vipButton").textContent = data.vip
      ? "VIP АКТИВЕН"
      : "КУПИТЬ VIP — 10 000 zł";
  }

  updateJobButtons();
}

function openScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));

  if (el(id)) el(id).classList.add("active");

  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));

  if (el("nav-" + id)) el("nav-" + id).classList.add("active");
  if (id === "inside" && el("nav-world")) el("nav-world").classList.add("active");
  if (id === "furniture" && el("nav-shop")) el("nav-shop").classList.add("active");
}

function spend(price) {
  if (data.balance < price) {
    alert("Недостаточно денег!");
    return false;
  }
  data.balance -= price;
  return true;
}

/* КЛИКЕР: БЕЗ ЭНЕРГИИ И ЛИМИТА */
function playClicker() {
  data.balance += data.vip ? 0.75 : 0.50;
  save();
}

/* ТАКСИ: 5 ЗАКАЗОВ В ДЕНЬ, НУЖНА МАШИНА */
function taxi() {
  const today = new Date().toLocaleDateString("en-CA");

  if (data.taxiDate !== today) {
    data.taxiDate = today;
    data.taxiOrders = 0;
  }

  if (data.car === "Нет машины") {
    alert("🚫 Сначала купи машину!");
    save();
    return;
  }

  if (data.taxiOrders >= 5) {
    alert("🚕 Все 5 заказов на сегодня выполнены. Возвращайся завтра!");
    save();
    return;
  }

  const reward = 50 + Math.floor(Math.random() * 101);
  data.balance += reward;
  data.taxiOrders++;

  save();

  alert(
    "🚕 Заказ выполнен!\nЗаработано: " + money(reward) +
    "\nЗаказы: " + data.taxiOrders + "/5"
  );
}

/* ДОСТАВКА: 10 ЗАКАЗОВ, ПЕРЕРЫВ 5–10 МИНУТ */
function delivery() {
  const now = Date.now();

  if (now < data.deliveryCooldownUntil) {
    alert("⏳ Доставка пока недоступна. Подожди таймер.");
    return;
  }

  if (data.deliveryOrders >= 10) {
    startDeliveryBreak();
    return;
  }

  const reward = 25 + Math.floor(Math.random() * 51);
  data.balance += reward;
  data.deliveryOrders++;

  if (data.deliveryOrders === 10) {
    const minutes = 5 + Math.floor(Math.random() * 6);
    data.deliveryCooldownUntil = Date.now() + minutes * 60000;
    save();

    alert(
      "📦 Десятая доставка выполнена!\n" +
      "Заработано: " + money(reward) +
      "\nПерерыв: " + minutes + " минут."
    );
    return;
  }

  save();

  alert(
    "📦 Доставка выполнена!\n+" + money(reward) +
    "\nЗаказы: " + data.deliveryOrders + "/10"
  );
}

function startDeliveryBreak() {
  const minutes = 5 + Math.floor(Math.random() * 6);
  data.deliveryCooldownUntil = Date.now() + minutes * 60000;
  save();
  alert("⏳ Перерыв на " + minutes + " минут.");
}

function updateJobButtons() {
  const today = new Date().toLocaleDateString("en-CA");

  if (data.taxiDate !== today) {
    data.taxiDate = today;
    data.taxiOrders = 0;
    localStorage.setItem("warsawSave", JSON.stringify(data));
  }

  const taxiButton = document.querySelector('button[onclick="taxi()"]');
  if (taxiButton) {
    const noCar = data.car === "Нет машины";
    const limit = data.taxiOrders >= 5;

    taxiButton.disabled = noCar || limit;
    taxiButton.textContent = noCar
      ? "НУЖНА МАШИНА"
      : limit
        ? "ЛИМИТ 5/5 — ЗАВТРА"
        : "ВЗЯТЬ ЗАКАЗ (" + data.taxiOrders + "/5)";
  }

  const deliveryButton = document.querySelector('button[onclick="delivery()"]');
  if (deliveryButton) {
    const remaining = data.deliveryCooldownUntil - Date.now();

    if (remaining > 0) {
      const mins = Math.floor(remaining / 60000);
      const secs = Math.floor((remaining % 60000) / 1000);

      deliveryButton.disabled = true;
      deliveryButton.textContent =
        "ОЖИДАНИЕ " + mins + ":" + String(secs).padStart(2, "0");
    } else {
      if (data.deliveryCooldownUntil > 0) {
        data.deliveryOrders = 0;
        data.deliveryCooldownUntil = 0;
        localStorage.setItem("warsawSave", JSON.stringify(data));
      }

      deliveryButton.disabled = false;
      deliveryButton.textContent =
        "ДОСТАВКА (" + data.deliveryOrders + "/10)";
    }
  }
}

function buyHouse(name, price) {
  if (data.home === name) {
    alert("Это уже твоё жильё.");
    return;
  }

  if (!spend(price)) return;
  data.home = name;
  save();
  alert("🏠 Теперь твоё жильё: " + name);
}

function buyCar(name, price) {
  if (data.car === name) {
    alert("Эта машина уже выбрана.");
    return;
  }

  if (!spend(price)) return;
  data.car = name;
  save();
  alert("🚘 Ты купил: " + name);
}

function buyFurniture(name, price) {
  if (data.furniture.includes(name)) {
    alert("У тебя уже есть этот предмет.");
    return;
  }

  if (!spend(price)) return;
  data.furniture.push(name);
  save();
  alert("🛋️ Куплено: " + name);
}

function buyVip() {
  if (data.vip) {
    alert("VIP уже активен!");
    return;
  }

  if (!spend(10000)) return;
  data.vip = true;
  save();
  alert("👑 Поздравляем! Ты VIP!");
}

function render() {
  if (el("houses")) {
    el("houses").innerHTML = houses.map(h => `
      <div class="card">
        <img src="${h.img}" alt="${h.name}">
        <h3>${h.emoji} ${h.name}</h3>
        <div class="price">${h.price ? money(h.price) : "Бесплатно"}</div>
        <button onclick="buyHouse('${h.name}',${h.price})">
          ${h.price ? "КУПИТЬ" : "ВЫБРАТЬ"}
        </button>
      </div>
    `).join("");
  }

  if (el("cars")) {
    el("cars").innerHTML = cars.map(c => `
      <div class="card">
        <img src="${c.img}" alt="${c.name}">
        <h3>${c.emoji} ${c.name}</h3>
        <div class="price">${money(c.price)}</div>
        <button onclick="buyCar('${c.name}',${c.price})">КУПИТЬ</button>
      </div>
    `).join("");
  }

  const furnitureHTML = furniture.map(f => `
    <div class="card">
      <img src="${f.img}" alt="${f.name}">
      <h3>${f.emoji} ${f.name}</h3>
      <div class="price">${money(f.price)}</div>
      <button onclick="buyFurniture('${f.name}',${f.price})">
        ${data.furniture.includes(f.name) ? "КУПЛЕНО" : "КУПИТЬ"}
      </button>
    </div>
  `).join("");

  if (el("furnitureList")) el("furnitureList").innerHTML = furnitureHTML;
  if (el("furnitureList2")) el("furnitureList2").innerHTML = furnitureHTML;
}

render();
update();
setInterval(updateJobButtons, 1000);
</script>
