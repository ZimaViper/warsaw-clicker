<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const defaults = {
  balance: 100,
  home: "Комната",
  car: "Нет машины",
  furniture: [],
  vip: false,
  taxiOrders: 0,
  deliveryOrders: 0,
  deliveryCooldownUntil: 0
};

let data;
try {
  data = { ...defaults, ...JSON.parse(localStorage.getItem("warsawSave") || "{}") };
} catch {
  data = { ...defaults };
}

const houses = [
  {name:"Комната",price:0,emoji:"🛏️",img:"https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=500"},
  {name:"Квартира",price:5000,emoji:"🏢",img:"https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=500"},
  {name:"Дом",price:50000,emoji:"🏡",img:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=500"},
  {name:"Особняк",price:500000,emoji:"🏰",img:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=500"}
];

const cars = [
  {name:"Fiat Panda",price:2000,emoji:"🚗",img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=700"},
  {name:"Opel Corsa",price:8000,emoji:"🚙",img:"https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=700"},
  {name:"Volkswagen Golf",price:20000,emoji:"🚘",img:"https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=700"},
  {name:"BMW 3",price:45000,emoji:"🚘",img:"https://images.unsplash.com/photo-1555215695-3004980ad54e?w=700"},
  {name:"Audi RS6",price:100000,emoji:"🏎️",img:"https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6?w=700"},
  {name:"Mercedes AMG",price:200000,emoji:"🏎️",img:"https://images.unsplash.com/photo-1563720223185-11003d516935?w=700"},
  {name:"BMW M5",price:400000,emoji:"🏎️",img:"https://images.unsplash.com/photo-1555215695-3004980ad54e?w=700"},
  {name:"Porsche 911",price:800000,emoji:"🏎️",img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=700"},
  {name:"Lamborghini",price:2000000,emoji:"🏎️",img:"https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=700"}
];

const furniture = [
  {name:"Диван",price:500,emoji:"🛋️",img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=700"},
  {name:"Телевизор",price:1000,emoji:"📺",img:"https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=700"},
  {name:"Кровать",price:1500,emoji:"🛏️",img:"https://images.unsplash.com/photo-1503602642458-232111445657?w=700"},
  {name:"Компьютер",price:3000,emoji:"💻",img:"https://images.unsplash.com/photo-1593640408182-31c70c8268f5?w=700"}
];

function money(n) {
  return Math.floor(n).toLocaleString("ru-RU") + " zł";
}

function save() {
  localStorage.setItem("warsawSave", JSON.stringify(data));
  update();
}

function update() {
  document.getElementById("balance").textContent = data.balance.toFixed(2) + " zł";
  document.getElementById("myhome").textContent = data.home;
  document.getElementById("insideHome").textContent = data.home;
  document.getElementById("mycar").textContent = data.car;
  document.getElementById("topmoney").textContent = money(data.balance);
  document.getElementById("myFurniture").textContent =
    data.furniture.length ? data.furniture.join(", ") : "Пока пусто";

  const selectedCar = cars.find(c => c.name === data.car);
  document.getElementById("outsideCar").innerHTML = selectedCar
    ? `<img src="${selectedCar.img}" alt="${selectedCar.name}">`
    : "🚗";

  const selectedHouse = houses.find(h => h.name === data.home) || houses[0];
  document.getElementById("outsideHouseImg").src = selectedHouse.img;
  document.getElementById("outsideHouseName").textContent = selectedHouse.name;

  document.getElementById("vipStatus").textContent =
    data.vip ? "👑 VIP активирован!" : "У тебя пока нет VIP.";
  document.getElementById("vipButton").textContent =
    data.vip ? "VIP АКТИВЕН" : "КУПИТЬ VIP — 10 000 zł";

  updateJobButtons();
}

function openScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  const nav = document.getElementById("nav-" + id);
  if (nav) nav.classList.add("active");
  if (id === "furniture") document.getElementById("nav-shop").classList.add("active");
  if (id === "inside") document.getElementById("nav-world").classList.add("active");
}

function spend(price) {
  if (data.balance < price) {
    alert("Недостаточно денег! Сначала заработай.");
    return false;
  }
  data.balance -= price;
  return true;
}

/* КЛИКЕР — БЕЗ ЭНЕРГИИ И БЕЗ ЛИМИТА */
function playClicker() {
  data.balance += data.vip ? 0.75 : 0.50;
  save();
}

/* ТАКСИ — 5 ЗАКАЗОВ, ТОЛЬКО ЕСЛИ ЕСТЬ МАШИНА */
function taxi() {
  if (data.car === "Нет машины") {
    alert("🚫 Для работы в такси сначала купи машину!");
    return;
  }

  if (data.taxiOrders >= 5) {
    alert("🚕 Ты выполнил все 5 заказов такси. Возвращайся завтра!");
    return;
  }

  const reward = 50 + Math.floor(Math.random() * 101);
  data.balance += reward;
  data.taxiOrders++;

  save();
  alert("🚕 Поездка завершена! Заработано " + money(reward) +
    "\nЗаказы такси: " + data.taxiOrders + "/5");
}

/* ДОСТАВКА — 10 ЗАКАЗОВ, ПОТОМ ПЕРЕРЫВ 5–10 МИНУТ */
function delivery() {
  const now = Date.now();

  if (now < data.deliveryCooldownUntil) {
    alert("📦 Доставка пока недоступна. Подожди окончания перерыва.");
    return;
  }

  if (data.deliveryOrders >= 10) {
    const minutes = 5 + Math.floor(Math.random() * 6);
    data.deliveryCooldownUntil = now + minutes * 60 * 1000;
    save();
    alert("⏳ Ты выполнил 10 доставок! Перерыв: " + minutes + " минут.");
    return;
  }

  const reward = 25 + Math.floor(Math.random() * 51);
  data.balance += reward;
  data.deliveryOrders++;

  if (data.deliveryOrders === 10) {
    const minutes = 5 + Math.floor(Math.random() * 6);
    data.deliveryCooldownUntil = now + minutes * 60 * 1000;
    save();
    alert("📦 Заказ выполнен! +" + money(reward) +
      "\nЭто была 10-я доставка. Перерыв: " + minutes + " минут.");
    return;
  }

  save();
  alert("📦 Доставка выполнена! +" + money(reward) +
    "\nЗаказы: " + data.deliveryOrders + "/10");
}

function updateJobButtons() {
  const taxiButton = document.querySelector('button[onclick="taxi()"]');
  const deliveryButton = document.querySelector('button[onclick="delivery()"]');

  if (taxiButton) {
    taxiButton.textContent = data.car === "Нет машины"
      ? "НУЖНА МАШИНА"
      : data.taxiOrders >= 5
        ? "ЛИМИТ 5/5 — ЗАВТРА"
        : "ВЗЯТЬ ЗАКАЗ (" + data.taxiOrders + "/5)";
    taxiButton.disabled = data.car === "Нет машины" || data.taxiOrders >= 5;
  }

  if (deliveryButton) {
    const remaining = data.deliveryCooldownUntil - Date.now();

    if (remaining > 0) {
      const mins = Math.floor(remaining / 60000);
      const secs = Math.floor((remaining % 60000) / 1000);
      deliveryButton.textContent = "ОЖИДАНИЕ " + mins + ":" + String(secs).padStart(2, "0");
      deliveryButton.disabled = true;
    } else {
      if (data.deliveryCooldownUntil > 0) {
        data.deliveryOrders = 0;
        data.deliveryCooldownUntil = 0;
        save();
      }
      deliveryButton.textContent = "ДОСТАВКА (" + data.deliveryOrders + "/10)";
      deliveryButton.disabled = false;
    }
  }
}

function buyHouse(name, price) {
  if (data.home === name) return alert("Это уже твоё жильё.");
  if (!spend(price)) return;
  data.home = name;
  save();
  alert("Поздравляем! Теперь твоё жильё: " + name);
}

function buyCar(name, price) {
  if (data.car === name) return alert("Эта машина уже выбрана.");
  if (!spend(price)) return;
  data.car = name;
  save();
  alert("Поздравляем! Твоя новая машина: " + name);
}

function buyFurniture(name, price) {
  if (data.furniture.includes(name)) return alert("У тебя уже есть этот предмет.");
  if (!spend(price)) return;
  data.furniture.push(name);
  save();
  alert("Куплено: " + name);
}

function buyVip() {
  if (data.vip) return alert("VIP уже активен!");
  if (!spend(10000)) return;
  data.vip = true;
  save();
  alert("Поздравляем! Теперь ты VIP!");
}

function render() {
  document.getElementById("houses").innerHTML = houses.map(h => `
    <div class="card">
      <img src="${h.img}" alt="${h.name}">
      <h3>${h.emoji} ${h.name}</h3>
      <div class="price">${h.price ? money(h.price) : "Бесплатно"}</div>
      <button onclick="buyHouse('${h.name}',${h.price})">${h.price ? "КУПИТЬ" : "ВЫБРАТЬ"}</button>
    </div>
  `).join("");

  document.getElementById("cars").innerHTML = cars.map(c => `
    <div class="card">
      <img src="${c.img}" alt="${c.name}">
      <h3>${c.emoji} ${c.name}</h3>
      <div class="price">${money(c.price)}</div>
      <button onclick="buyCar('${c.name}',${c.price})">КУПИТЬ</button>
    </div>
  `).join("");

  const furnitureHTML = furniture.map(f => `
    <div class="card">
      <img class="furniture-photo" src="${f.img}" alt="${f.name}">
      <h3>${f.emoji} ${f.name}</h3>
      <div class="price">${money(f.price)}</div>
      <button onclick="buyFurniture('${f.name}',${f.price})">
        ${data.furniture.includes(f.name) ? "КУПЛЕНО" : "КУПИТЬ"}
      </button>
    </div>
  `).join("");

  document.getElementById("furnitureList").innerHTML = furnitureHTML;
  document.getElementById("furnitureList2").innerHTML = furnitureHTML;
}

render();
update();
setInterval(updateJobButtons, 1000);
</script>
